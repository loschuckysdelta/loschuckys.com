<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Recursos</title>
  <meta name="description" content="Sube y administra imágenes y videos de tu VPS." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <span class="eyebrow">VPS MEDIA</span>
        <h1>Gestor de recursos</h1>
        <p>Sube imágenes y videos a tu VPS y copia su enlace público cuando lo necesites.</p>
      </div>
      <div class="status-pill" id="serverStatus">
        <span class="dot"></span>
        <span>Comprobando...</span>
      </div>
    </section>

    <section class="panel">
      <form id="uploadForm">
        <label class="dropzone" id="dropzone" for="archivo">
          <input id="archivo" name="archivo" type="file"
            accept=".jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov,image/*,video/*" />
          <div class="drop-icon">⬆</div>
          <strong>Arrastra una imagen o video aquí</strong>
          <span>o haz clic para seleccionar un archivo</span>
        </label>

        <div class="preview-wrap" id="previewWrap" hidden>
          <div id="preview"></div>
          <div class="preview-info">
            <strong id="fileName"></strong>
            <span id="fileSize"></span>
          </div>
        </div>

        <div class="upload-actions">
          <button class="primary" id="uploadButton" type="submit" disabled>Subir archivo</button>
          <button class="ghost" id="clearButton" type="button" disabled>Limpiar</button>
        </div>

        <div class="progress" id="progressWrap" hidden>
          <div class="progress-bar"><span id="progressBar"></span></div>
          <span id="progressText">0%</span>
        </div>

        <p class="message" id="uploadMessage"></p>
      </form>
    </section>

    <section class="toolbar">
      <div class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar por nombre..." autocomplete="off" />
      </div>

      <div class="filters" role="group" aria-label="Filtros">
        <button class="filter active" data-type="">Todos</button>
        <button class="filter" data-type="image">Imágenes</button>
        <button class="filter" data-type="video">Videos</button>
      </div>
    </section>

    <section class="content-head">
      <div>
        <h2>Recursos</h2>
        <p id="resultCount">0 recursos</p>
      </div>
      <button class="ghost" id="refreshButton" type="button">Actualizar</button>
    </section>

    <section id="resourcesGrid" class="resources-grid"></section>

    <section id="emptyState" class="empty" hidden>
      <div>▧</div>
      <h3>No hay recursos</h3>
      <p>Sube tu primera imagen o video para verlo aquí.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
